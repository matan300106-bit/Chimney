<text x="130.500" y="159.000" font-family="Heebo" font-size="3.30" font-weight="700" fill="#2b2b2b" text-anchor="start" direction="rtl">בית, גן ומים</text>
<text x="130.500" y="163.800" font-family="Heebo" font-size="2.50" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">בריכה 14×4 מ&#x27;, דקי טיק, עצי זית וחרוב, פרגולות ומערכת PV על הגג.</text>

<text x="734.264" y="190.000" font-family="Heebo" font-size="4.10" font-weight="700" fill="#2b2b2b" text-anchor="start" direction="rtl">הצהרת פרויקט</text>

<text x="743.000" y="204.100" font-family="Frank Ruhl Libre" font-size="7.00" font-weight="500" fill="#2b2b2b" text-anchor="start" direction="rtl">רכס ואופק</text>
<text x="743.000" y="212.000" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">בית כורכר הוא וילת בוטיק למשפחה בשכונת הגולף (רובע 13) בקיסריה – הנקודה הגבוהה בעיר,</text>
<text x="743.000" y="216.503" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">הצופה אל מרחבי הגולף ואל קו האופק של הים. הבית נולד משני דימויים מקומיים: רכס הכורכר –</text>
<text x="743.000" y="221.006" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">שלד האבן של מישור החוף, וקו האופק – המתח האופקי בין שמיים לים. בסיס כבד מחופה אבן</text>
<text x="743.000" y="225.509" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">בגוון כורכר נטוע בקרקע; מעליו מונח נפח קל בטיח לבן, הנשלח 5 מ&#x27; דרומה אל הגן והבריכה וממסגר</text>
<text x="743.000" y="230.012" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">את האופק דרך לוג&#x27;יית ההורים.</text>
<text x="743.000" y="245.715" font-family="Frank Ruhl Libre" font-size="5.60" font-weight="500" fill="#9c8460" text-anchor="end">02</text>
<text x="733.822" y="245.515" font-family="Heebo" font-size="4.10" font-weight="700" fill="#2b2b2b" text-anchor="start" direction="rtl">קיסריה – היסטוריה וחומר</text>
<line x1="630.500" y1="248.915" x2="743.000" y2="248.915" stroke="#2b2b2b" stroke-width="0.300" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
<text x="743.000" y="258.015" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">הורדוס ייסד את קיסריה בשנים 22–10 לפנה&quot;ס על אתר &#x27;מגדל סטרטון&#x27; וקרא לה על שם הקיסר</text>
<text x="743.000" y="262.518" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">אוגוסטוס. העיר נבנתה מאבן הכורכר המקומית – אבן חול גירית ונקבובית – שצופתה בטיח לבן</text>
<text x="743.000" y="267.021" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">מבריק, כך שנראתה מן הים כעיר של שיש. בלבה נבנה נמל סבסטוס, מן הנמלים המלאכותיים</text>
<text x="743.000" y="271.524" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">הגדולים בעולם העתיק, ששוברי הגלים שלו נוצקו בבטון הידראולי בתוך הים. אמת המים הובילה</text>
<text x="743.000" y="276.027" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">מים ממעיינות הכרמל, ושורת קשתותיה לאורך החוף יוצרת מקצב חוזר של אור וצל.</text>
<text x="743.000" y="286.530" font-family="Heebo" font-size="2.90" font-weight="700" fill="#2b2b2b" text-anchor="start" direction="rtl">מן העבר אל הבית:</text>

<line x1="508.000" y1="193.400" x2="620.500" y2="193.400" stroke="#2b2b2b" stroke-width="0.300" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
<text x="620.500" y="202.500" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">וילת בוטיק היא בית פרטי המתוכנן בהשראת מלונאות בוטיק: מעט חללים, לכל אחד זהות ברורה,</text>
<text x="620.500" y="207.003" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">איכות ביצוע גבוהה ותשומת לב לפרט. הבית מאורגן כרצף חוויות – הגעה דרך חצר מים, מבואה</text>
<text x="620.500" y="211.506" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">בגובה כפול ודלת ציר, חלל מגורים הנפתח לגן ולבריכה, ספא, קולנוע ובר במרתף הפונים לפטיו</text>
<text x="620.500" y="216.009" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">שקוע, וסוויטת הורים עם לוג&#x27;יה פרטית. העיצוב מוביל: פלטת חומרים מצומצמת, נגרות בהתאמה</text>
<text x="620.500" y="220.512" font-family="Heebo" font-size="2.85" font-weight="400" fill="#34302b" text-anchor="start" direction="rtl">ותאורה מדורגת – כמו במלון, בקנה מידה של משפחה.</text>
